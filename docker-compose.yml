services:
  postgres:
    image: postgres:18
    container_name: peakda-postgres
    environment:
      POSTGRES_DB: peakda
      POSTGRES_USER: peakda
      POSTGRES_PASSWORD: peakda
    ports:
      - "5439:5432"
    volumes:
      - peakda-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2.1-alpine
    container_name: peakda-redis
    ports:
      - "6383:6379"
    volumes:
      - peakda-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  peakda-postgres-data:
  peakda-redis-data:
