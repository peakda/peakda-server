name: Deploy Dev (OCI)

on:
  workflow_dispatch:

concurrency:
  group: deploy-oci-development
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build jar
        run: ./gradlew build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: image
        env:
          IMAGE_REPO: ghcr.io/peakda/peakda-server
        run: |
          docker buildx build --platform linux/arm64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_REPO:dev-$GITHUB_SHA" --push \
            --metadata-file "$RUNNER_TEMP/dev-image.json" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/dev-image.json")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oci-development
    permissions:
      packages: read
    steps:
      - name: Deploy develop image to OCI
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [ -z "$OCI_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "oci-development 환경에 OCI_HOST, OCI_DEPLOY_SSH_KEY, OCI_SSH_KNOWN_HOSTS를 설정하세요."
            exit 1
          fi
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/peakda-dev-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$TOKEN" | ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$OCI_HOST" "deploy $GITHUB_SHA $IMAGE_DIGEST $GITHUB_ACTOR"

      - name: Verify public readiness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --max-time 10 https://api-dev.peakda.com/actuator/health/readiness
