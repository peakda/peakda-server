spring:
  datasource:
    url: jdbc:postgresql://localhost:5439/peakda
    username: peakda
    password: peakda
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6383

app:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    domain:
    secure: false
    same-site: Lax

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
