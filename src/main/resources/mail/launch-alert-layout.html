<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f2;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#17212b;">
          <tr>
            <td style="font-size:14px;font-weight:700;color:#16a34a;">피크다 Peakda</td>
          </tr>
          <tr>
            <td style="padding-top:12px;font-size:22px;font-weight:700;line-height:1.4;">{{headline}}</td>
          </tr>
          <tr>
            <td style="padding-top:4px;font-size:15px;line-height:1.7;color:#3d4954;">{{body}}</td>
          </tr>
          <tr>
            <td style="padding-top:24px;">
              <a href="{{storeUrl}}" style="display:inline-block;padding:14px 24px;border-radius:999px;background:#16a34a;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">{{buttonLabel}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:32px;font-size:12px;line-height:1.6;color:#8a949d;">{{footer}}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
