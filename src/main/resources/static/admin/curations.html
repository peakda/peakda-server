<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>큐레이션 관리 - PEAKDA</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/admin/css/app.css">
  </head>
  <body data-page="curations">
    <div id="app-shell" class="app-shell is-loading">
      <aside id="app-sidebar" class="app-sidebar"></aside>
      <div class="app-workspace">
        <header id="app-header" class="app-header"></header>
        <main id="page-content" class="page-content">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Editorial</p>
                <h1>큐레이션 관리</h1>
                <p>주차 큐레이션을 상태별로 확인하고 편집 화면으로 이동합니다.</p>
              </div>
              <a class="button button-primary" href="/admin/curation-edit.html">새 큐레이션</a>
            </div>

            <div class="toolbar">
              <div id="status-tabs" class="tab-list" role="tablist" aria-label="큐레이션 상태 필터">
                <button class="tab-button is-active" type="button" data-status="">전체</button>
                <button class="tab-button" type="button" data-status="DRAFT">임시저장</button>
                <button class="tab-button" type="button" data-status="PUBLISHED">발행</button>
              </div>
              <label class="field field-inline">
                <span>페이지 크기</span>
                <select id="page-size" class="field__control">
                  <option value="10">10개</option>
                  <option value="20" selected>20개</option>
                  <option value="50">50개</option>
                </select>
              </label>
              <button id="refresh-button" class="button button-secondary" type="button">새로고침</button>
            </div>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col">상태</th>
                    <th scope="col">주차</th>
                    <th scope="col">제목</th>
                    <th scope="col">기간</th>
                    <th scope="col">발행 시각</th>
                    <th scope="col">구성</th>
                    <th scope="col">관리</th>
                  </tr>
                </thead>
                <tbody id="curation-rows"></tbody>
              </table>
            </div>
            <nav id="pagination" class="pagination" aria-label="큐레이션 페이지"></nav>
          </section>
        </main>
      </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="modal-root" class="modal-root"></div>
    <script type="module" src="/admin/js/curations.js"></script>
  </body>
</html>
