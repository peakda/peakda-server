<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>축제·트리 명소 관리 - PEAKDA</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/admin/css/app.css">
  </head>
  <body data-page="festivals">
    <div id="app-shell" class="app-shell is-loading">
      <aside id="app-sidebar" class="app-sidebar"></aside>
      <div class="app-workspace">
        <header id="app-header" class="app-header"></header>
        <main id="page-content" class="page-content">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Festival</p>
                <h1>축제·트리 명소 관리</h1>
                <p>공공데이터에 없는 축제·트리 명소는 직접 등록하고, 결과를 선택해 발행용 에디토리얼을 저장합니다.</p>
              </div>
              <button id="create-button" class="button button-primary" type="button">직접 등록</button>
            </div>

            <form id="search-form" class="toolbar">
              <label class="field field-inline">
                <span>축제명</span>
                <input id="festival-query" class="field__control" maxlength="100" placeholder="예: 해바라기">
              </label>
              <label class="field field-inline">
                <span>종류</span>
                <select id="festival-kind" class="field__control">
                  <option value="">전체</option>
                  <option value="FESTIVAL">축제·행사</option>
                  <option value="TREE">트리 명소</option>
                </select>
              </label>
              <button id="search-button" class="button button-primary" type="submit">검색</button>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <caption>축제 검색 결과</caption>
                <thead>
                  <tr>
                    <th scope="col">축제</th>
                    <th scope="col">기간</th>
                    <th scope="col">단계</th>
                    <th scope="col">에디토리얼</th>
                    <th scope="col">고정</th>
                  </tr>
                </thead>
                <tbody id="festival-results"></tbody>
              </table>
            </div>
            <div id="festival-pagination" class="pagination"></div>
          </section>

          <article id="festival-summary" class="panel" hidden></article>

          <form id="base-form" class="editor-form" hidden>
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2 id="base-form-title">기본 정보</h2>
                  <p>직접 등록한 축제·트리 명소만 수정할 수 있습니다. 공공데이터 동기화는 이 정보를 덮어쓰지 않습니다.</p>
                </div>
                <div class="inline-actions">
                  <button id="base-delete-button" class="button button-danger" type="button">축제 삭제</button>
                  <button id="base-save-button" class="button button-primary" type="submit">기본 정보 저장</button>
                </div>
              </div>

              <div class="panel-body form-grid">
                <label class="field">
                  <span class="field__label">종류</span>
                  <select id="base-kind" class="field__control" required>
                    <option value="TREE">트리 명소</option>
                    <option value="FESTIVAL">축제·행사</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field__label">이름</span>
                  <input id="base-name" class="field__control" maxlength="200" required>
                </label>
                <label class="field">
                  <span class="field__label">장소명</span>
                  <input id="base-venue" class="field__control" maxlength="200" required>
                </label>
                <label class="field">
                  <span class="field__label">시작일</span>
                  <input id="base-starts-on" class="field__control" type="date" required>
                </label>
                <label class="field">
                  <span class="field__label">종료일 (하루짜리면 비움)</span>
                  <input id="base-ends-on" class="field__control" type="date">
                </label>
                <label class="field">
                  <span class="field__label">도로명 주소</span>
                  <input id="base-road-address" class="field__control" maxlength="500">
                </label>
                <label class="field">
                  <span class="field__label">위도</span>
                  <input id="base-latitude" class="field__control" type="number" step="any" min="-90" max="90">
                </label>
                <label class="field">
                  <span class="field__label">경도</span>
                  <input id="base-longitude" class="field__control" type="number" step="any" min="-180" max="180">
                </label>
                <label class="field">
                  <span class="field__label">홈페이지 URL</span>
                  <input id="base-homepage-url" class="field__control" type="url" maxlength="2000">
                </label>
                <label class="field">
                  <span class="field__label">문의 전화번호</span>
                  <input id="base-phone-number" class="field__control" maxlength="100">
                </label>
                <label class="field">
                  <span class="field__label">주최</span>
                  <input id="base-host-organization" class="field__control" maxlength="200">
                </label>
                <label class="field">
                  <span class="field__label">주관</span>
                  <input id="base-organizing-institution" class="field__control" maxlength="200">
                </label>
              </div>
            </section>
          </form>

          <form id="festival-form" class="editor-form" hidden>
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>에디토리얼</h2>
                  <p>운영 시간·입장료·오시는 길·대표 이미지·볼거리 등 상세 화면 정보를 저장합니다.</p>
                </div>
                <div class="inline-actions">
                  <button id="delete-button" class="button button-danger" type="button">삭제</button>
                  <button id="save-button" class="button button-primary" type="submit">저장</button>
                </div>
              </div>

              <div class="panel-body form-grid">
                <label class="field">
                  <span class="field__label">상태</span>
                  <select id="status" class="field__control" required>
                    <option value="DRAFT">임시저장</option>
                    <option value="PUBLISHED">발행</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field__label">입장료</span>
                  <input id="admission-fee" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">운영 시간</span>
                  <input id="operating-hours" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">주의사항</span>
                  <input id="caution" class="field__control" maxlength="1000">
                </label>
              </div>

              <div class="panel-body form-grid">
                <label class="field">
                  <span class="field__label">훅</span>
                  <textarea id="hook" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
                <label class="field">
                  <span class="field__label">기간 메모</span>
                  <input id="period-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">장소 메모</span>
                  <input id="place-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">입장료 메모</span>
                  <input id="admission-fee-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">운영 시간 메모</span>
                  <input id="operating-hours-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">주의사항 메모</span>
                  <input id="caution-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">대중교통 안내</span>
                  <textarea id="directions-transit" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
                <label class="field">
                  <span class="field__label">자가 차량 안내</span>
                  <textarea id="directions-car" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>히어로 이미지</h2>
                  <p>큐레이션 이미지 업로드 API를 공용으로 사용합니다.</p>
                </div>
              </div>
              <div class="panel-body image-editor">
                <label class="field">
                  <span class="field__label">저장 이미지 키</span>
                  <input id="hero-image-key" class="field__control" maxlength="2000">
                </label>
                <label class="field">
                  <span class="field__label">이미지 업로드 (WebP, 최대 1600×900으로 저장)</span>
                  <input id="hero-image-file" class="field__control" type="file" accept="image/jpeg,image/png,image/webp">
                </label>
                <div id="hero-preview" class="image-preview" aria-live="polite"></div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>주요 볼거리</h2>
                  <p>최대 3개까지 저장됩니다.</p>
                </div>
                <button id="add-highlight" class="button button-secondary" type="button">볼거리 추가</button>
              </div>
              <div id="highlights" class="panel-body editor-stack"></div>
            </section>
          </form>
        </main>
      </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="modal-root" class="modal-root"></div>
    <script type="module" src="/admin/js/festivals.js"></script>
  </body>
</html>
