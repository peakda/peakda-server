<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>축제 에디토리얼 관리 - PEAKDA</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/admin/css/app.css">
  </head>
  <body data-page="festivals">
    <div id="app-shell" class="app-shell is-loading">
      <aside id="app-sidebar" class="app-sidebar"></aside>
      <div class="app-workspace">
        <header id="app-header" class="app-header"></header>
        <main id="page-content" class="page-content">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Festival</p>
                <h1>축제 에디토리얼 관리</h1>
                <p>축제명으로 검색하고 결과를 선택해 발행용 에디토리얼 필드를 저장합니다.</p>
              </div>
            </div>

            <form id="search-form" class="toolbar">
              <label class="field field-inline">
                <span>축제명</span>
                <input id="festival-query" class="field__control" maxlength="100" placeholder="예: 해바라기">
              </label>
              <button id="search-button" class="button button-primary" type="submit">검색</button>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <caption>축제 검색 결과</caption>
                <thead>
                  <tr>
                    <th scope="col">축제</th>
                    <th scope="col">기간</th>
                    <th scope="col">에디토리얼</th>
                  </tr>
                </thead>
                <tbody id="festival-results"></tbody>
              </table>
            </div>
            <div id="festival-pagination" class="pagination"></div>
          </section>

          <article id="festival-summary" class="panel" hidden></article>

          <form id="festival-form" class="editor-form" hidden>
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>에디토리얼</h2>
                  <p>축제 원천 기간과 상태는 서버 상세값을 그대로 확인만 합니다.</p>
                </div>
                <div class="inline-actions">
                  <button id="delete-button" class="button button-danger" type="button">삭제</button>
                  <button id="save-button" class="button button-primary" type="submit">저장</button>
                </div>
              </div>

              <div class="panel-body form-grid">
                <label class="field">
                  <span class="field__label">상태</span>
                  <select id="status" class="field__control" required>
                    <option value="DRAFT">임시저장</option>
                    <option value="PUBLISHED">발행</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field__label">입장료</span>
                  <input id="admission-fee" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">운영 시간</span>
                  <input id="operating-hours" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">주의사항</span>
                  <input id="caution" class="field__control" maxlength="1000">
                </label>
              </div>

              <div class="panel-body form-grid">
                <label class="field">
                  <span class="field__label">훅</span>
                  <textarea id="hook" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
                <label class="field">
                  <span class="field__label">기간 메모</span>
                  <input id="period-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">장소 메모</span>
                  <input id="place-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">입장료 메모</span>
                  <input id="admission-fee-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">운영 시간 메모</span>
                  <input id="operating-hours-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">주의사항 메모</span>
                  <input id="caution-note" class="field__control" maxlength="1000">
                </label>
                <label class="field">
                  <span class="field__label">대중교통 안내</span>
                  <textarea id="directions-transit" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
                <label class="field">
                  <span class="field__label">자가 차량 안내</span>
                  <textarea id="directions-car" class="field__control" maxlength="5000" rows="4"></textarea>
                </label>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>히어로 이미지</h2>
                  <p>큐레이션 이미지 업로드 API를 공용으로 사용합니다.</p>
                </div>
              </div>
              <div class="panel-body image-editor">
                <label class="field">
                  <span class="field__label">저장 이미지 키</span>
                  <input id="hero-image-key" class="field__control" maxlength="2000">
                </label>
                <label class="field">
                  <span class="field__label">이미지 업로드</span>
                  <input id="hero-image-file" class="field__control" type="file" accept="image/jpeg,image/png,image/webp">
                </label>
                <div id="hero-preview" class="image-preview" aria-live="polite"></div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>주요 볼거리</h2>
                  <p>최대 3개까지 저장됩니다.</p>
                </div>
                <button id="add-highlight" class="button button-secondary" type="button">볼거리 추가</button>
              </div>
              <div id="highlights" class="panel-body editor-stack"></div>
            </section>
          </form>
        </main>
      </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="modal-root" class="modal-root"></div>
    <script type="module" src="/admin/js/festivals.js"></script>
  </body>
</html>
