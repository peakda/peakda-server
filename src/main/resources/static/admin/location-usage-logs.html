<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
  <title>위치정보 이용·제공사실 | PEAKDA Admin</title>
  <script type="module" src="./js/location-usage-logs.js"></script>
</head>
<body data-page="location-usage-logs">
  <div id="app-shell" class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="관리자 메뉴"></aside>
    <div class="app-workspace">
      <header id="app-header" class="app-header"></header>
      <main id="page-content" class="page-content" tabindex="-1">
        <section class="page-section" aria-labelledby="location-usage-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">운영</p>
              <h1 id="location-usage-title">위치정보 이용·제공사실 확인자료</h1>
            </div>
            <button type="button" class="button" id="location-usage-refresh-button">새로고침</button>
          </div>

          <form id="location-usage-filter-form" class="toolbar" aria-label="위치정보 이용 기록 필터">
            <label class="field field-inline" for="location-usage-email">
              <span>대상 이메일</span>
              <input id="location-usage-email" name="email" type="search" placeholder="ex1@xxx.com" autocomplete="off">
            </label>
            <label class="field field-inline" for="location-usage-service">
              <span>제공서비스</span>
              <select id="location-usage-service" name="service">
                <option value="">전체</option>
                <option value="BLOOM_MAP">지도 영역 개화 현황</option>
                <option value="CURATION_DETAIL">큐레이션 상세 거리 계산</option>
                <option value="SPOT_MATCH">좌표 기반 스팟 매칭</option>
                <option value="SPOT_PREVIEW">지도 핀 프리뷰</option>
              </select>
            </label>
            <label class="field field-inline" for="location-usage-from">
              <span>시작 일시</span>
              <input id="location-usage-from" name="from" type="datetime-local">
            </label>
            <label class="field field-inline" for="location-usage-to">
              <span>종료 일시</span>
              <input id="location-usage-to" name="to" type="datetime-local">
            </label>
            <label class="field field-inline" for="location-usage-size">
              <span>표시 수</span>
              <input id="location-usage-size" name="size" type="number" min="1" max="50" value="20" inputmode="numeric">
            </label>
            <button type="submit" class="button">검색</button>
          </form>

          <div class="table-wrap" aria-live="polite" aria-busy="false" id="location-usage-table-wrap">
            <table class="data-table">
              <caption>위치정보 이용·제공사실 확인자료 목록</caption>
              <thead>
                <tr>
                  <th scope="col">대상</th>
                  <th scope="col">취득경로</th>
                  <th scope="col">제공서비스</th>
                  <th scope="col">이용일시</th>
                </tr>
              </thead>
              <tbody id="location-usage-table-body"></tbody>
            </table>
          </div>
          <nav id="location-usage-pagination" class="pagination" aria-label="위치정보 이용 기록 페이지"></nav>
        </section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
</body>
</html>
