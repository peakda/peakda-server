<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
  <title>감사 로그 | PEAKDA Admin</title>
  <script type="module" src="./js/audit-logs.js"></script>
</head>
<body data-page="audit-logs">
  <div id="app-shell" class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="관리자 메뉴"></aside>
    <div class="app-workspace">
      <header id="app-header" class="app-header"></header>
      <main id="page-content" class="page-content" tabindex="-1">
        <section class="page-section" aria-labelledby="audit-logs-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">운영</p>
              <h1 id="audit-logs-title">감사 로그</h1>
            </div>
            <button type="button" class="button" id="audit-refresh-button">새로고침</button>
          </div>

          <form id="audit-filter-form" class="toolbar" aria-label="감사 로그 필터">
            <label class="field field-inline" for="audit-target-type">
              <span>대상 종류</span>
              <select id="audit-target-type" name="targetType">
                <option value="">전체</option>
                <option value="SPOT_RECORD">스팟 기록</option>
                <option value="USER">사용자</option>
                <option value="PLANT">식물</option>
                <option value="CURATION">큐레이션</option>
                <option value="FESTIVAL">축제</option>
                <option value="NOTICE">공지</option>
                <option value="SCHEDULER_JOB">스케줄러 잡</option>
              </select>
            </label>
            <label class="field field-inline" for="audit-target-id">
              <span>대상 ID</span>
              <input id="audit-target-id" name="targetId" type="number" min="0" inputmode="numeric">
            </label>
            <label class="field field-inline" for="audit-admin-id">
              <span>관리자 ID</span>
              <input id="audit-admin-id" name="adminId" type="number" min="1" inputmode="numeric">
            </label>
            <label class="field field-inline" for="audit-size">
              <span>표시 수</span>
              <input id="audit-size" name="size" type="number" min="1" max="50" value="20" inputmode="numeric">
            </label>
            <button type="submit" class="button">조회</button>
          </form>

          <div class="table-wrap" aria-live="polite" aria-busy="false" id="audit-table-wrap">
            <table class="data-table">
              <caption>관리자 감사 로그 목록</caption>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">관리자</th>
                  <th scope="col">액션</th>
                  <th scope="col">대상</th>
                  <th scope="col">메모</th>
                  <th scope="col">일시</th>
                </tr>
              </thead>
              <tbody id="audit-table-body"></tbody>
            </table>
          </div>
          <nav id="audit-pagination" class="pagination" aria-label="감사 로그 페이지"></nav>
        </section>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
</body>
</html>
