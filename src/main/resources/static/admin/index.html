<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="css/app.css">
    <title>대시보드 · PEAKDA 운영 콘솔</title>
</head>
<body data-page="dashboard">
    <div class="app-shell is-loading" id="app-shell">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <div class="app-workspace">
            <header class="app-header" id="app-header"></header>
            <main class="page-content" id="page-content">
                <section class="signal-grid" aria-label="운영 현황">
                    <a class="signal-card signal-alert" href="/admin/reports.html">
                        <span>미처리 신고 대상</span>
                        <strong id="pending-report-count">—</strong>
                        <small>심사 대기 중인 대상</small>
                    </a>
                    <a class="signal-card signal-review" href="/admin/plants.html">
                        <span>검수 대기 식물</span>
                        <strong id="pending-plant-count">—</strong>
                        <small>사용자가 제안한 활성 식물</small>
                    </a>
                    <a class="signal-card signal-draft" href="/admin/notices.html">
                        <span>초안 공지</span>
                        <strong id="draft-notice-count">—</strong>
                        <small>발송 전 DRAFT</small>
                    </a>
                    <a class="signal-card signal-failed" href="/admin/jobs.html">
                        <span>최근 24시간 실패 잡</span>
                        <strong id="failed-job-count">—</strong>
                        <small>최근 24시간 FAILED</small>
                    </a>
                </section>

                <section class="panel dashboard-guide">
                    <div class="panel-header">
                        <div>
                            <p class="eyebrow">OPERATIONS QUEUE</p>
                            <h2>오늘 먼저 볼 항목</h2>
                        </div>
                    </div>
                    <div class="queue-list">
                        <a href="/admin/reports.html">
                            <span class="queue-index">01</span>
                            <span><strong>신고 심사</strong><small>대상 콘텐츠와 사유 분포를 확인하고 조치합니다.</small></span>
                            <span aria-hidden="true">→</span>
                        </a>
                        <a href="/admin/plants.html">
                            <span class="queue-index">02</span>
                            <span><strong>식물 제안 검수</strong><small>이름·계절·개화 분류를 정리합니다.</small></span>
                            <span aria-hidden="true">→</span>
                        </a>
                        <a href="/admin/jobs.html">
                            <span class="queue-index">03</span>
                            <span><strong>실패 잡 확인</strong><small>최근 실행 결과와 오류 메시지를 점검합니다.</small></span>
                            <span aria-hidden="true">→</span>
                        </a>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
