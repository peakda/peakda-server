server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:4}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL}

app:
  cookie:
    domain: ${COOKIE_DOMAIN}
    secure: true
    same-site: None
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  openapi:
    servers:
      local: https://api.peakda.com
      dev: https://api.peakda.com
  storage:
    endpoint: ${STORAGE_ENDPOINT:https://s3.${AWS_REGION:ap-northeast-2}.amazonaws.com}
    region: ${AWS_REGION:ap-northeast-2}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:false}

external:
  scheduler:
    enabled: ${EXTERNAL_SCHEDULER_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.peakda: INFO
